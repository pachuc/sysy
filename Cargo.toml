[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_stack_frames = "deny"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gpui = "=0.2.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
sysy-core = { path = "crates/sysy-core" }
sysy-layout = { path = "crates/sysy-layout" }
sysy-ui = { path = "crates/sysy-ui" }

# Optimize dependencies (GPUI in particular) even in dev builds; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
